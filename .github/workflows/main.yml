# Put this file in your GitHub repo at:  .github/workflows/build-ipa.yml
# Then: Actions tab -> "Build AJ Classic IPA" -> Run workflow -> paste the zip link.
name: Build AJ Classic IPA

on:
  workflow_dispatch:
    inputs:
      zip_url:
        description: "Direct download link to a zip containing the .swift files"
        required: true
        type: string
      bundle_id:
        description: "Bundle identifier"
        required: false
        default: "com.example.ajclassic"
        type: string

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Download and unpack the Swift sources
        env:
          ZIP_URL: ${{ inputs.zip_url }}
        run: |
          set -euo pipefail
          mkdir -p Sources _unz
          curl -fL "$ZIP_URL" -o src.zip
          unzip -q -o src.zip -d _unz
          find _unz -name '*.swift' -not -path '*/__MACOSX/*' -exec cp {} Sources/ \;
          echo "Swift files found:"
          ls -1 Sources
          test -n "$(ls Sources/*.swift 2>/dev/null)" || { echo "No .swift files in the zip"; exit 1; }

      - name: Write the Xcode project spec
        env:
          BUNDLE_ID: ${{ inputs.bundle_id }}
        run: |
          cat > project.yml <<EOF
          name: AJClassic
          options:
            deploymentTarget:
              iOS: "15.0"
          targets:
            AJClassic:
              type: application
              platform: iOS
              sources: [Sources]
              settings:
                base:
                  PRODUCT_BUNDLE_IDENTIFIER: ${BUNDLE_ID}
                  PRODUCT_NAME: AJClassic
                  MARKETING_VERSION: "1.0"
                  CURRENT_PROJECT_VERSION: "1"
                  SWIFT_VERSION: "5.0"
                  TARGETED_DEVICE_FAMILY: "1,2"
              info:
                path: Info.plist
                properties:
                  CFBundleDisplayName: AJ Classic
                  UILaunchScreen: {}
                  UISupportedInterfaceOrientations:
                    - UIInterfaceOrientationPortrait
                    - UIInterfaceOrientationLandscapeLeft
                    - UIInterfaceOrientationLandscapeRight
                  NSAppTransportSecurity:
                    NSAllowsLocalNetworking: true
          EOF
          cat project.yml

      - name: Generate the Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build (unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project AJClassic.xcodeproj \
            -scheme AJClassic \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee build.log

      - name: Package the IPA
        run: |
          set -euo pipefail
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/AJClassic.app Payload/
          zip -qr AJClassic.ipa Payload
          ls -lh AJClassic.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: AJClassic-ipa
          path: AJClassic.ipa

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
