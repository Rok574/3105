name: Build ProxyBrowser for iPhone (Unsigned)

on:
  workflow_dispatch:
    inputs:
      catbox_zip_url:
        description: "Direct Catbox ZIP URL containing the ProxyBrowser Sources folder"
        required: true
        type: string

jobs:
  build-iphone:
    runs-on: macos-latest
    steps:
      - name: Check out workflow
        uses: actions/checkout@v4

      - name: Download and extract source ZIP
        env:
          ZIP_URL: ${{ inputs.catbox_zip_url }}
        run: |
          set -euo pipefail
          case "$ZIP_URL" in
            https://files.catbox.moe/*) ;;
            *) echo "Use a direct https://files.catbox.moe/ ZIP URL"; exit 1 ;;
          esac

          curl --fail --location --retry 3 "$ZIP_URL" -o "$RUNNER_TEMP/proxybrowser.zip"
          unzip -t "$RUNNER_TEMP/proxybrowser.zip"
          mkdir -p "$RUNNER_TEMP/source"
          unzip -q "$RUNNER_TEMP/proxybrowser.zip" -d "$RUNNER_TEMP/source"

          SOURCE_DIR="$(find "$RUNNER_TEMP/source" -type d -name Sources -print -quit)"
          if [ -z "$SOURCE_DIR" ]; then
            echo "ZIP must contain a Sources directory with Swift files and Info.plist."
            exit 1
          fi
          rm -rf Sources
          cp -R "$SOURCE_DIR" ./Sources

      - name: Fix Swift reload button compile error
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("Sources/ContentView.swift")
          source = path.read_text(encoding="utf-8")
          pattern = re.compile(
              r'^(?P<indent>\s*)tab\.isLoading\s*\?\s*tab\.webView\.stopLoading\(\)\s*:\s*tab\.webView\.reload\(\)\s*$',
              re.MULTILINE,
          )
          replacement = (
              r'\g<indent>if tab.isLoading {\n'
              r'\g<indent>    tab.webView.stopLoading()\n'
              r'\g<indent>} else {\n'
              r'\g<indent>    tab.webView.reload()\n'
              r'\g<indent>}'
          )
          updated, count = pattern.subn(replacement, source, count=1)
          if count != 1:
              raise SystemExit(
                  "Could not find the exact reload/stopLoading expression in "
                  "Sources/ContentView.swift. Check whether the Catbox ZIP has the expected source version."
              )
          path.write_text(updated, encoding="utf-8")
          print("Patched ContentView.swift: reload/stopLoading now uses if/else.")
          PY

      - name: Create XcodeGen spec
        run: |
          cat > project.yml <<'YAML'
          name: ProxyBrowser
          options:
            bundleIdPrefix: com.proxybrowser
            deploymentTarget:
              iOS: "17.0"
          targets:
            ProxyBrowser:
              type: application
              platform: iOS
              sources:
                - Sources
              settings:
                base:
                  PRODUCT_BUNDLE_IDENTIFIER: com.proxybrowser.app
                  SWIFT_VERSION: "5.0"
                  INFOPLIST_FILE: Sources/Info.plist
                  GENERATE_INFOPLIST_FILE: NO
                  TARGETED_DEVICE_FAMILY: "1"
                  SUPPORTED_PLATFORMS: "iphoneos"
          YAML

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build unsigned app for physical iPhone
        run: |
          set -o pipefail
          xcodebuild \
            -project ProxyBrowser.xcodeproj \
            -scheme ProxyBrowser \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          APP_PATH="$RUNNER_TEMP/DerivedData/Build/Products/Release-iphoneos/ProxyBrowser.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "Build did not produce ProxyBrowser.app"
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          cp -R "$APP_PATH" "$RUNNER_TEMP/ipa/Payload/ProxyBrowser.app"
          cd "$RUNNER_TEMP/ipa"
          zip -qr "$RUNNER_TEMP/ProxyBrowser-unsigned.ipa" Payload

      - name: Upload unsigned iPhone IPA
        uses: actions/upload-artifact@v4
        with:
          name: ProxyBrowser-iPhone-unsigned-IPA
          path: ${{ runner.temp }}/ProxyBrowser-unsigned.ipa
          if-no-files-found: error
          retention-days: 7
