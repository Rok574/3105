
name: Build Muzo for iPhone 6

on:
  workflow_dispatch:
    inputs:
      zip_url:
        description: "Direct download URL for the Muzo ZIP"
        required: true
        type: string

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Download ZIP
        env:
          ZIP_URL: ${{ inputs.zip_url }}
        run: |
          curl -fL "$ZIP_URL" -o Muzo-source.zip
          mkdir source
          unzip -q Muzo-source.zip -d source

      - name: Locate project
        id: locate
        run: |
          PROJECT_YML=$(find source -name project.yml -print -quit)
          if [ -n "$PROJECT_YML" ]; then
            cd "$(dirname "$PROJECT_YML")"
            brew install xcodegen
            xcodegen generate
          fi

          PROJECT=$(find source -name "*.xcodeproj" -print -quit)
          if [ -z "$PROJECT" ]; then
            echo "No Xcode project found in ZIP"
            exit 1
          fi

          echo "project=$PROJECT" >> "$GITHUB_OUTPUT"

      - name: Find scheme
        id: scheme
        run: |
          SCHEME=$(xcodebuild -list -json \
            -project "${{ steps.locate.outputs.project }}" |
            python3 -c 'import json,sys; print(json.load(sys.stdin)["project"]["schemes"][0])')
          echo "name=$SCHEME" >> "$GITHUB_OUTPUT"

      - name: Build for iPhone 6
        run: |
          xcodebuild \
            -project "${{ steps.locate.outputs.project }}" \
            -scheme "${{ steps.scheme.outputs.name }}" \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -derivedDataPath build \
            IPHONEOS_DEPLOYMENT_TARGET=12.0 \
            ARCHS=arm64 \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package downloaded source
        run: |
          cd source
          zip -qr ../Muzo.zip .

      - name: Upload ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Muzo-iPhone-6
          path: Muzo.zip

      - name: Upload compiled app
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Muzo-iPhone-6-build
          path: build/Build/Products/Release-iphoneos/
