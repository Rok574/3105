name: Build Theos Tweak from ZIP

on:
  workflow_dispatch:
    inputs:
      zip_url:
        description: 'Direct URL to the Theos project .zip archive'
        required: true
        type: string
      final_package:
        description: 'Build release package (FINALPACKAGE=1)'
        required: false
        default: true
        type: boolean

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Install Theos, toolchain, and SDKs
        uses: waruhachi/theos-action@v2.6.6
        with:
          theos-src: 'theos/theos'
          theos-branch: 'master'
          sdks-src: 'theos/sdks'
          sdks-branch: 'master'

      - name: Download and extract ZIP
        env:
          ZIP_URL: ${{ inputs.zip_url }}
        run: |
          mkdir -p "$GITHUB_WORKSPACE/src"
          curl -fL "$ZIP_URL" -o /tmp/project.zip
          unzip -q /tmp/project.zip -d "$GITHUB_WORKSPACE/src"
          rm -f /tmp/project.zip

          MAKEFILE_PATH=$(find "$GITHUB_WORKSPACE/src" -maxdepth 3 -name "Makefile" \
            | awk '{ print gsub("/", "/"), $0 }' \
            | sort -n \
            | head -n 1 \
            | cut -d' ' -f2-)
          if [ -z "$MAKEFILE_PATH" ]; then
            echo "Error: No Makefile found in extracted archive."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$MAKEFILE_PATH")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Detected project directory: $PROJECT_DIR"

      - name: Build .deb package
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          if [ "${{ inputs.final_package }}" = "true" ]; then
            make package FINALPACKAGE=1
          else
            make package
          fi

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: theos-deb-package
          path: ${{ env.PROJECT_DIR }}/packages/*.deb
          if-no-files-found: error
