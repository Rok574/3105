name: Build tweak from zip

on:
  workflow_dispatch:
    inputs:
      zip_url:
        description: "Direct download URL of the tweak project .zip (must contain a Makefile)"
        required: true
        type: string

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Install build tools
        run: brew install ldid dpkg make xz

      - name: Install Theos
        run: |
          git clone --recursive --depth 1 https://github.com/theos/theos.git "$HOME/theos"
          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"

      - name: Download and extract project zip
        env:
          ZIP_URL: ${{ inputs.zip_url }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/dl" "$RUNNER_TEMP/src"
          curl -fL --retry 3 -o "$RUNNER_TEMP/dl/tweak.zip" "$ZIP_URL"
          unzip -q "$RUNNER_TEMP/dl/tweak.zip" -d "$RUNNER_TEMP/src"

          # The Makefile may be at the zip root or inside one folder.
          MAKEFILE="$(find "$RUNNER_TEMP/src" -maxdepth 3 -name Makefile -not -path '*/__MACOSX/*' | head -n 1)"
          if [ -z "$MAKEFILE" ]; then
            echo "No Makefile found in the zip" >&2
            exit 1
          fi
          echo "PROJECT_DIR=$(dirname "$MAKEFILE")" >> "$GITHUB_ENV"

      - name: Build .deb
        working-directory: ${{ env.PROJECT_DIR }}
        run: gmake package FINALPACKAGE=1

      - name: Collect packages
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/out"
          cp "$PROJECT_DIR"/packages/*.deb "$GITHUB_WORKSPACE/out/"
          ls -l "$GITHUB_WORKSPACE/out"

      - name: Upload .deb
        uses: actions/upload-artifact@v4
        with:
          name: tweak-deb
          path: out/*.deb
          if-no-files-found: error
